<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leanncd — Lean 4 Implementation</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #d8dce8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    padding: 48px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 28px; font-weight: 700; color: #edf0f8; margin: 32px 0 16px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; font-weight: 700; color: #edf0f8; margin: 28px 0 12px; border-bottom: 1px solid #252a38; padding-bottom: 6px; }
  h3 { font-size: 16px; font-weight: 600; color: #edf0f8; margin: 20px 0 8px; }
  h4, h5, h6 { font-size: 14px; font-weight: 600; color: #8b92a8; margin: 16px 0 6px; }
  p { margin-bottom: 14px; }
  a { color: #5c9cf5; text-decoration: none; border-bottom: 1px solid #3a5a9a; }
  a:hover { color: #7eb3f5; }
  code {
    font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
    font-size: 12.5px;
    background: #1e2330;
    border: 1px solid #252a38;
    border-radius: 3px;
    padding: 1px 6px;
    color: #b8d4ff;
  }
  pre {
    background: #1e2330;
    border: 1px solid #252a38;
    border-left: 3px solid #5c9cf5;
    border-radius: 6px;
    padding: 18px 20px;
    overflow-x: auto;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.55;
  }
  pre code { background: none; border: none; padding: 0; color: #c8d0e8; }
  blockquote {
    border-left: 3px solid #5c9cf5;
    padding: 10px 20px;
    background: #171b26;
    margin: 16px 0;
    color: #8b92a8;
  }
  ul, ol { padding-left: 24px; margin-bottom: 14px; }
  li { margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  th { background: #171b26; color: #8b92a8; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 14px; text-align: left; border-bottom: 1px solid #252a38; }
  td { padding: 10px 14px; border-bottom: 1px solid #1c2030; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  hr { border: none; border-top: 1px solid #252a38; margin: 32px 0; }
  strong { color: #edf0f8; font-weight: 600; }
  #loading { color: #8b92a8; font-style: italic; }
  #error { color: #f07070; }
  .back-link { display: inline-block; margin-bottom: 32px; font-size: 13px; color: #5c9cf5; border-bottom: 1px solid #3a5a9a; }
</style>
</head>
<body>
<a class="back-link" href="exec_summary.html">← Executive Summary</a>
<div id="content"><span id="loading">Loading…</span></div>
<script>
fetch('leanncd.md')
  .then(r => {
    if (!r.ok) throw new Error(r.statusText);
    return r.text();
  })
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  })
  .catch(err => {
    document.getElementById('content').innerHTML =
      '<span id="error">Failed to load leanncd.md: ' + err.message + '</span>';
  });
</script>
</body>
</html>
