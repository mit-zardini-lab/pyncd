name = "leanncd"
defaultTargets = ["LeanNCD", "Tests"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[require]]
name = "LSpec"
git = "https://github.com/argumentcomputer/LSpec.git"
rev = "d3c15b93a1dd4e7c8d5c0c3825c9555737e55c3e"

[[lean_lib]]
name = "LeanNCD"

# Test suite under test/ (srcDir). `globs` builds each test module directly, so
# `lake build` (Tests is a default target) elaborates them — firing every #guard /
# example-by-rfl / #print axioms check and failing the build on regression.
# (LSpec to be adopted at Milestone D/E for the executable layer; see the roadmap.)
[[lean_lib]]
name = "Tests"
srcDir = "test"
globs = ["Base.NumericTest", "Base.StTest", "Base.BrTest", "Base.BrWiringTest",
         "Seam.AdapterTest", "Core.GradedTest", "Core.WeaveTest",
         "Mixins.TemporalTest", "Mixins.StubsTest", "Grothendieck.SplitTest",
         "Algebra.AlgebraTest", "Algebra.ConstructTest",
         "Props.GenericTest", "Instances.StBrTest",
         "Exec.UidTest", "Exec.TraversableTest", "Exec.ContextTest", "Exec.ContextSpec",
         "DSL.SizeExprTest", "DSL.AstTest", "DSL.SyntaxTest", "DSL.ParseLayer1Test",
         "DSL.ParseLayer34Test", "DSL.ParseNaryTest", "DSL.ParseProgramTest",
         "DSL.ParseExamplesTest", "DSL.ParsePredicatesTest",
         "DSL.Pipeline.TargetTest", "DSL.Pipeline.TraverseTest",
         "DSL.Pipeline.StructuralTest", "DSL.Pipeline.LoweringTest",
         "DSL.MaxReduceTest",
         "DSL.Pipeline.ScanAffineTest", "DSL.Pipeline.RecurMorphismTest",
         "DSL.Pipeline.RouteWeaveTest",
         "DSL.CompileExamplesTest",
         "Bridge.RealizeTest", "Bridge.SBrTest", "Bridge.AgreementTest",
         "Acset.SBrInstanceTest", "Acset.CsvTest", "Acset.IoTest",
         "Acset.FixtureTest",
         "Eval.TensorTest", "Eval.ShapeTest", "Eval.GatherTest",
         "Eval.ContractTest", "Eval.NonlinTest", "Eval.ScatterTest",
         "Eval.AffineShapeSolverTest",
         "Eval.ScanTest", "Eval.EvalExamplesTest"]
